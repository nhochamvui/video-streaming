services:
  redis:
    image: redis:7-alpine
    container_name: rtmp-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - rtmp-net

  traefik:
    image: traefik:v3.7
    container_name: rtmp-traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
    volumes:
      - ./traefik/traefik-local.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/traefik-dynamic-dev.yml:/etc/traefik/dynamic/traefik-dynamic.yml:ro
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - rtmp-net

networks:
  rtmp-net:

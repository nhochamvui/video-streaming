#Wed Jun 04 02:17:04 UTC 2025
micronaut.application.name=rtmp
micronaut.server.port=8888

micronaut.router.static-resources.hls.enabled=true
micronaut.router.static-resources.hls.mapping=/hls/**
micronaut.router.static-resources.hls.paths=file:./hls

micronaut.router.static-resources.static.enabled=true
micronaut.router.static-resources.static.mapping=/static/**
micronaut.router.static-resources.static.paths=${RTMP_STATIC_DIR:classpath:static}

micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins=*
micronaut.server.cors.configurations.web.allowed-methods=GET,POST,OPTIONS

redis.uri=${REDIS_URI:`redis://localhost:6379`}

rtmp.server-id=${RTMP_SERVER_ID:local-node}
rtmp.port=${RTMP_PORT:1935}
rtmp.endpoint=${RTMP_ENDPOINT:`rtmp://localhost/live`}
rtmp.playback-base-url=${RTMP_PLAYBACK_BASE_URL:`http://localhost:8888`}
rtmp.hls.root=${RTMP_HLS_ROOT:`hls`}
rtmp.auth.hmac-secret=${RTMP_HMAC_SECRET:123456789123456789123456789123456789}
rtmp.hls.bucket=${RTMP_HLS_BUCKET:}
rtmp.hls.region=${RTMP_HLS_REGION:}
rtmp.hls.cdn-url=${RTMP_HLS_CDN_URL:}
rtmp.limits.pending-per-ip=${RTMP_MAX_PENDING_PER_IP:5}
rtmp.limits.active-per-ip=${RTMP_MAX_ACTIVE_PER_IP:5}
rtmp.health.max-cpu-pct=${RTMP_HEALTH_MAX_CPU_PCT:95}
rtmp.health.max-mem-pct=${RTMP_HEALTH_MAX_MEM_PCT:90}

rtmp.auth.username=${RTMP_AUTH_USERNAME:admin}
rtmp.auth.password=${RTMP_AUTH_PASSWORD:Admin@1234}
rtmp.auth.cookie-name=${RTMP_AUTH_COOKIE_NAME:rtmp_session}
rtmp.auth.session-ttl-seconds=${RTMP_AUTH_SESSION_TTL_SECONDS:3600}
rtmp.auth.cookie-secure=${RTMP_AUTH_COOKIE_SECURE:false}

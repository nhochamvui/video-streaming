plugins {
    id("groovy") 
    id("io.micronaut.application") version "4.5.3"
    id("com.gradleup.shadow") version "8.3.6"
    id("io.micronaut.aot") version "4.5.3"
}

version = "2.0-beta"
group = "com.nhochamvui.rtmp"

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-http-validation")
    annotationProcessor("io.micronaut.serde:micronaut-serde-processor")
    implementation("io.micronaut:micronaut-aop")
    implementation("io.micronaut:micronaut-jackson-databind")
    // implementation("io.micronaut:micronaut-scheduling")
    implementation("io.micronaut.serde:micronaut-serde-jackson")
    implementation("io.lettuce:lettuce-core:6.5.5.RELEASE")
    implementation("org.apache.commons:commons-pool2:2.12.0")
    implementation("io.micronaut:micronaut-management")
    implementation("io.micrometer:micrometer-core")
    implementation("software.amazon.awssdk:ecs")
    implementation("software.amazon.awssdk:url-connection-client")
    compileOnly("io.micronaut:micronaut-http-client")
    runtimeOnly("io.micrometer:micrometer-registry-prometheus")
    runtimeOnly("ch.qos.logback:logback-classic")
    testImplementation("io.micronaut:micronaut-http-client")
    testImplementation("org.apache.groovy:groovy:4.0.14")
}


application {
    mainClass = "com.nhochamvui.rtmp.Application"
}
java {
    sourceCompatibility = JavaVersion.toVersion("21")
    targetCompatibility = JavaVersion.toVersion("21")
}


shadowJar {
    manifest {
        attributes('Implementation-Version': version)
    }
}

def frontendDir = file("frontend")
def frontendDist = file("frontend/dist")
def staticResourcesDir = file("src/main/resources/static")
def skipFrontendBuild = project.hasProperty("skipFrontendBuild")

tasks.register("npmInstall", Exec) {
    workingDir frontendDir
    commandLine "npm", "ci"
    onlyIf {
        !skipFrontendBuild && !file("${frontendDir}/node_modules/.package-lock.json").exists()
    }
}

tasks.register("buildFrontend", Exec) {
    dependsOn "npmInstall"
    workingDir frontendDir
    commandLine "npm", "run", "build"
    outputs.dir frontendDist
    onlyIf {
        !skipFrontendBuild && !file("${frontendDist}/index.html").exists()
    }
}

tasks.register("copyFrontendDist", Copy) {
    dependsOn "buildFrontend"
    from frontendDist
    into staticResourcesDir
    include "**/*"
    doFirst {
        delete file("${staticResourcesDir}/index.html")
        delete file("${staticResourcesDir}/assets")
    }
}

tasks.named("processResources") {
    dependsOn "copyFrontendDist"
}

tasks.named("inspectRuntimeClasspath") {
    dependsOn "copyFrontendDist"
}

graalvmNative.toolchainDetection = false

def nativeImageMemory = System.getenv("NATIVE_IMAGE_MEMORY") ?: "-J-Xmx8g"

graalvmNative.binaries.main {
    buildArgs.addAll(
        "--report-unsupported-elements-at-runtime",
        "--no-fallback",
        "--enable-url-protocols=https",
        "--enable-all-security-services",
        "-H:IncludeResources=static/index.html",
        nativeImageMemory
    )
}

micronaut {
    runtime("netty")
    testRuntime("spock2")
    processing {
        incremental(true)
        annotations("com.nhochamvui.rtmp.*")
    }
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}


tasks.named("dockerfileNative") {
    jdkVersion = "21"
}

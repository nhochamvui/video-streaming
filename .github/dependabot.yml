version: 2
updates:
  # Java backend (Gradle)
  - package-ecosystem: "gradle"
    directory: "/java/rtmp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # React frontend (npm)
  - package-ecosystem: "npm"
    directory: "/java/rtmp/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # AWS CDK app (npm)
  - package-ecosystem: "npm"
    directory: "/java/rtmp/infra/aws"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Go HLS segmenter
  - package-ecosystem: "gomod"
    directory: "/java/rtmp/go-hls"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Container base images referenced by the Dockerfiles
  - package-ecosystem: "docker"
    directory: "/java/rtmp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

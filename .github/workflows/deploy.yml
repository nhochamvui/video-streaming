name: Build and Push Docker Image

on:
  push:
    branches: [test/live-stream-server]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "gradle"

      - name: Build native image
        working-directory: java/rtmp
        run: ./gradlew nativeCompile --no-daemon

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: rtmp-native
          path: java/rtmp/build/native/nativeCompile/rtmp
          retention-days: 7

  build-and-push:
    runs-on: ubuntu-latest
    needs: native-build
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: rtmp-native
          path: java/rtmp/build/native/nativeCompile

      - name: Extract version
        run: echo "VERSION=$(grep '^version' build.gradle | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_ENV
        working-directory: java/rtmp

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: java/rtmp/frontend
          file: java/rtmp/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/nhochamvui/video-streamming-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push native Docker image
        uses: docker/build-push-action@v6
        with:
          context: java/rtmp
          file: java/rtmp/Dockerfile.native-runtime
          push: true
          build-contexts: |
            binary=${{ github.workspace }}/java/rtmp/build/native/nativeCompile
          tags: |
            ghcr.io/nhochamvui/video-streamming:latest
            ghcr.io/nhochamvui/video-streamming:${{ env.VERSION }}
            ghcr.io/nhochamvui/video-streamming:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
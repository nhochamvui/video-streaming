# ─── RTMP Stress Test — GitHub Actions ────────────────────────────────────────
# Set these secrets in repo: Settings > Secrets and variables > Actions
#   RTMP_HOST       = your-server-ip-or-domain (REQUIRED)
#   RTMP_PORT       = 1935 (optional)
#   RTMP_API_PORT   = HTTP API port, 80 (optional)
#   RTMP_USERNAME   = UI/API login username (REQUIRED)
#   RTMP_PASSWORD   = UI/API login password (REQUIRED)
#
# The job logs in once, creates a stream session per bot via the API to obtain
# a stream key, then publishes each bot to rtmp://host:1935/live/<key>. Bots are
# spawned in batches of 5 with a random 30-45s pause between batches, so the ASG
# has time to scale new nodes instead of taking a concurrency spike.
#
# Publish failures are retried (connectivity/scale-out lag) and expired
# sessions are re-created, up to a bounded number of rounds.
#
# Triggers: manual (workflow_dispatch) + cron (schedule)

name: RTMP Stress Test

on:
  workflow_dispatch:
    inputs:
      bot_count:
        description: "Max number of bots to spawn"
        required: true
        type: number
        default: 15
      bot_duration:
        description: "Stream duration per bot (seconds)"
        required: true
        type: number
        default: 300
      resolution:
        description: "Video resolution (WxH)"
        required: false
        type: string
        default: "1280x720"
      bitrate:
        description: "Video bitrate (e.g. 2500k)"
        required: false
        type: string
        default: "2500k"
      burst_bot_count:
        description: "Total number of bots in burst mode"
        required: true
        type: number
        default: 100
      burst_mode:
        description: "Enable low-res high-concurrency burst"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/30 * * * *"

env:
  RTMP_HOST: ${{ secrets.RTMP_HOST }}
  RTMP_PORT: ${{ secrets.RTMP_PORT || '1935' }}
  RTMP_API_PORT: ${{ secrets.RTMP_API_PORT || '80' }}
  RTMP_USERNAME: ${{ secrets.RTMP_USERNAME }}
  RTMP_PASSWORD: ${{ secrets.RTMP_PASSWORD }}

jobs:
  # ─── Normal stress test (single runner, global batch ramp) ─────────────────
  rtmp-bot:
    if: ${{ !inputs.burst_mode && vars.SKIP_SCHEDULED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run RTMP bots
        run: |
          DURATION=${{ inputs.bot_duration || 300 }}
          RES=${{ inputs.resolution || '1280x720' }}
          BR=${{ inputs.bitrate || '2500k' }}
          BOT_COUNT=${{ inputs.bot_count || 15 }}
          BATCH_SIZE=5
          API_BASE="http://${RTMP_HOST}:${RTMP_API_PORT}"

          LOGIN_CODE=$(curl -sS -o /tmp/login.json -w '%{http_code}' -c cookies.txt \
            -X POST "${API_BASE}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${RTMP_USERNAME}\",\"password\":\"${RTMP_PASSWORD}\"}")
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "Login failed (HTTP ${LOGIN_CODE})"
            cat /tmp/login.json
            exit 1
          fi

          create_session() {
            local out=$1
            for attempt in 1 2 3; do
              SESSION_CODE=$(curl -sS -o "$out" -w '%{http_code}' -b cookies.txt \
                -X POST "${API_BASE}/api/v1/stream-sessions")
              KEY=$(jq -r '.streamKey // empty' "$out")
              if [ "$SESSION_CODE" = "201" ] && [ -n "$KEY" ]; then
                echo "$KEY"
                return 0
              fi
              echo "Session creation attempt ${attempt}/3 failed (HTTP ${SESSION_CODE})" >&2
              cat "$out" >&2
              [ "$attempt" -lt 3 ] && sleep 5
            done
            echo ""
            return 1
          }

          run_bot() {
            local bot=$1
            local out="/tmp/session-$bot.json"
            local log="ffmpeg-bot-$bot.log"
            local round key
            for round in 1 2 3; do
              key=$(create_session "$out") || return 1
              if [ -z "$key" ]; then
                echo "Bot ${bot} (round ${round}/3): failed to create stream session" > "$log"
                return 1
              fi
              PLAYBACK_URL=$(jq -r '.playbackUrl // empty' "$out")
              echo "Bot ${bot} → rtmp://${RTMP_HOST}:${RTMP_PORT}/live/${key} (playback: ${PLAYBACK_URL}, round ${round}/3)" > "$log"
              for attempt in $(seq 1 5); do
                if ffmpeg \
                  -re \
                  -f lavfi -i "testsrc=duration=${DURATION}:size=${RES}:rate=30" \
                  -f lavfi -i "sine=frequency=440:duration=${DURATION}" \
                  -c:v libx264 -preset ultrafast -tune zerolatency -b:v "${BR}" \
                  -c:a aac -b:a 64k \
                  -f flv \
                  "rtmp://${RTMP_HOST}:${RTMP_PORT}/live/${key}" >> "$log" 2>&1; then
                  return 0
                fi
                echo "Bot ${bot}: publish attempt ${attempt}/5 failed, retrying in 15s" >> "$log"
                [ "$attempt" -lt 5 ] && sleep 15
              done
              echo "Bot ${bot}: stream key expired, re-creating session" >> "$log"
            done
            return 1
          }

          echo "Spawning up to ${BOT_COUNT} bots in batches of ${BATCH_SIZE} every 30-45s | Resolution: ${RES} | Bitrate: ${BR} | Duration: ${DURATION}s"
          LAUNCHED=0
          while [ "$LAUNCHED" -lt "$BOT_COUNT" ]; do
            STEP=$BATCH_SIZE
            REMAIN=$(( BOT_COUNT - LAUNCHED ))
            if [ "$STEP" -gt "$REMAIN" ]; then STEP=$REMAIN; fi
            for i in $(seq 1 "$STEP"); do
              run_bot "$(( LAUNCHED + i ))" &
            done
            LAUNCHED=$(( LAUNCHED + STEP ))
            echo "Launched $LAUNCHED/$BOT_COUNT bots"
            if [ "$LAUNCHED" -lt "$BOT_COUNT" ]; then
              WAIT=$((30 + RANDOM % 16))
              echo "Waiting ${WAIT}s for ASG scaling..."
              sleep "$WAIT"
            fi
          done
          wait

      - name: Upload FFmpeg logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-logs
          path: ffmpeg-bot-*.log
          retention-days: 1

  # ─── Burst mode: low-res bots x 2 minutes — batched ramp ───────────────────
  burst:
    if: ${{ inputs.burst_mode == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run burst bots
        run: |
          BOT_COUNT=${{ inputs.burst_bot_count || 100 }}
          BATCH_SIZE=5
          API_BASE="http://${RTMP_HOST}:${RTMP_API_PORT}"

          LOGIN_CODE=$(curl -sS -o /tmp/login.json -w '%{http_code}' -c cookies.txt \
            -X POST "${API_BASE}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${RTMP_USERNAME}\",\"password\":\"${RTMP_PASSWORD}\"}")
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "Login failed (HTTP ${LOGIN_CODE})"
            cat /tmp/login.json
            exit 1
          fi

          create_session() {
            local out=$1
            for attempt in 1 2 3; do
              SESSION_CODE=$(curl -sS -o "$out" -w '%{http_code}' -b cookies.txt \
                -X POST "${API_BASE}/api/v1/stream-sessions")
              KEY=$(jq -r '.streamKey // empty' "$out")
              if [ "$SESSION_CODE" = "201" ] && [ -n "$KEY" ]; then
                echo "$KEY"
                return 0
              fi
              echo "Session creation attempt ${attempt}/3 failed (HTTP ${SESSION_CODE})" >&2
              cat "$out" >&2
              [ "$attempt" -lt 3 ] && sleep 5
            done
            echo ""
            return 1
          }

          run_bot() {
            local bot=$1
            local out="/tmp/session-$bot.json"
            local log="ffmpeg-burst-$bot.log"
            local round key
            for round in 1 2 3; do
              key=$(create_session "$out") || return 1
              if [ -z "$key" ]; then
                echo "Burst bot ${bot} (round ${round}/3): failed to create stream session" > "$log"
                return 1
              fi
              PLAYBACK_URL=$(jq -r '.playbackUrl // empty' "$out")
              echo "Burst bot ${bot} → rtmp://${RTMP_HOST}:${RTMP_PORT}/live/${key} (playback: ${PLAYBACK_URL}, round ${round}/3)" > "$log"
              for attempt in $(seq 1 5); do
                if ffmpeg \
                  -re \
                  -f lavfi -i "testsrc=duration=120:size=640x360:rate=30" \
                  -f lavfi -i "sine=frequency=440:duration=120" \
                  -c:v libx264 -preset ultrafast -tune zerolatency -b:v 800k \
                  -c:a aac -b:a 48k \
                  -f flv \
                  "rtmp://${RTMP_HOST}:${RTMP_PORT}/live/${key}" >> "$log" 2>&1; then
                  return 0
                fi
                echo "Burst bot ${bot}: publish attempt ${attempt}/5 failed, retrying in 15s" >> "$log"
                [ "$attempt" -lt 5 ] && sleep 15
              done
              echo "Burst bot ${bot}: stream key expired, re-creating session" >> "$log"
            done
            return 1
          }

          echo "Burst: spawning up to ${BOT_COUNT} bots in batches of ${BATCH_SIZE} every 30-45s"
          LAUNCHED=0
          while [ "$LAUNCHED" -lt "$BOT_COUNT" ]; do
            STEP=$BATCH_SIZE
            REMAIN=$(( BOT_COUNT - LAUNCHED ))
            if [ "$STEP" -gt "$REMAIN" ]; then STEP=$REMAIN; fi
            for i in $(seq 1 "$STEP"); do
              run_bot "$(( LAUNCHED + i ))" &
            done
            LAUNCHED=$(( LAUNCHED + STEP ))
            echo "Burst: launched $LAUNCHED/$BOT_COUNT bots"
            if [ "$LAUNCHED" -lt "$BOT_COUNT" ]; then
              WAIT=$((30 + RANDOM % 16))
              echo "Burst: waiting ${WAIT}s for ASG scaling..."
              sleep "$WAIT"
            fi
          done
          wait

      - name: Upload burst logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-logs-burst
          path: ffmpeg-burst-*.log
          retention-days: 1
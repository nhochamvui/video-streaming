name: RTMP AWS Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "CDK action to run"
        required: true
        type: choice
        default: "deploy"
        options:
          - synth
          - deploy
          - destroy
      deploy_mode:
        description: "Infra mode"
        required: true
        type: choice
        default: "cheap"
        options:
          - cheap
          - managed
      build_type:
        description: "App image build type: native (Dockerfile.native) or jvm (Dockerfile)"
        required: false
        type: choice
        default: "native"
        options:
          - jvm
          - native
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "ap-southeast-1"
      desired_app_count:
        description: "Number of app nodes/tasks"
        required: true
        type: number
        default: 1
      max_app_count:
        description: "Maximum cheap-mode demo app ports to expose"
        required: true
        type: number
        default: 3
      frontend_tag:
        description: "Frontend image tag to pull from ECR during app image build"
        required: false
        type: string
        default: "latest"
      instance_type:
        description: "Cheap-mode ECS EC2 instance type"
        required: true
        type: string
        default: "t4g.nano"
      rtmp_host:
        description: "RTMP host advertised to streamers. For cheap mode, point a domain to the proxy Elastic IP output."
        required: false
        type: string
        default: "zoutube.duckdns.com"
      admin_cidr:
        description: "CIDR allowed to SSH to cheap-mode EC2"
        required: false
        type: string
        default: "0.0.0.0/0"
      enable_alb:
        description: "Managed mode: create ALB for HTTP/UI/API"
        required: false
        type: boolean
        default: false
      enable_nlb:
        description: "Managed mode: create NLB for RTMP"
        required: false
        type: boolean
        default: false
      enable_elasticache:
        description: "Managed mode: create shared ElastiCache Redis"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rtmp-aws-${{ inputs.deploy_mode }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  ECR_REPOSITORY: rtmp-demo
  ECR_FRONTEND_REPOSITORY: rtmp-frontend
  INFRA_DIR: java/rtmp/infra/aws

jobs:
  cdk:
    name: ${{ inputs.action }} ${{ inputs.deploy_mode }} stack
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache CDK dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.INFRA_DIR }}/node_modules
          key: cdk-${{ runner.os }}-${{ hashFiles(format('{0}/package.json', env.INFRA_DIR)) }}
          restore-keys: |
            cdk-${{ runner.os }}-

      - name: Install CDK dependencies
        working-directory: ${{ env.INFRA_DIR }}
        run: npm install

      - name: Build CDK app
        working-directory: ${{ env.INFRA_DIR }}
        run: npm run build

      - name: Ensure ECR repository exists
        if: ${{ inputs.action == 'deploy' }}
        run: |
          for REPO in "${ECR_REPOSITORY}" "${ECR_FRONTEND_REPOSITORY}"; do
            aws ecr describe-repositories --repository-names "${REPO}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "${REPO}" >/dev/null
          done

      - name: Log in to Amazon ECR
        if: ${{ inputs.action == 'deploy' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ inputs.action == 'deploy' }}
        uses: docker/setup-buildx-action@v3

      - name: Check if app image already exists
        if: ${{ inputs.action == 'deploy' }}
        id: image-exists
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          if docker manifest inspect "$REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push app image
        if: ${{ inputs.action == 'deploy' && steps.image-exists.outputs.exists == 'false' }}
        id: image
        uses: docker/build-push-action@v6
        with:
          context: java/rtmp
          file: ${{ inputs.build_type == 'native' && 'java/rtmp/Dockerfile.native' || 'java/rtmp/Dockerfile' }}
          platforms: linux/arm64
          push: true
          build-contexts: |
            frontend=docker-image://${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ inputs.frontend_tag || 'latest' }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve app image
        id: app-image
        run: |
          if [ "${{ inputs.action }}" = "deploy" ]; then
            echo "uri=${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=public.ecr.aws/docker/library/eclipse-temurin:21-jre" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve stack names
        id: stacks
        run: |
          if [ "${{ inputs.deploy_mode }}" = "managed" ]; then
            echo "infra=RtmpManagedDemoInfraStack" >> "$GITHUB_OUTPUT"
            echo "app=RtmpManagedDemoAppStack" >> "$GITHUB_OUTPUT"
          else
            echo "infra=RtmpCheapDemoInfraStack" >> "$GITHUB_OUTPUT"
            echo "app=RtmpCheapDemoAppStack" >> "$GITHUB_OUTPUT"
          fi

      - name: CDK synth
        if: ${{ inputs.action == 'synth' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk synth \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: CDK deploy
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk deploy --require-approval never \
            "${{ steps.stacks.outputs.infra }}" \
            "${{ steps.stacks.outputs.app }}" \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: Force cleanup before destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          if [ "${{ inputs.deploy_mode }}" = "managed" ]; then
            APP_STACK="RtmpManagedDemoAppStack"
            INFRA_STACK="RtmpManagedDemoInfraStack"
          else
            APP_STACK="RtmpCheapDemoAppStack"
            INFRA_STACK="RtmpCheapDemoInfraStack"
          fi

          stack_exists() {
            aws cloudformation describe-stacks --stack-name "$1" >/dev/null 2>&1
          }

          list_resources() {
            aws cloudformation describe-stack-resources \
              --stack-name "$1" \
              --query "StackResources[?ResourceType=='$2'].PhysicalResourceId" \
              --output text 2>/dev/null | tr '\t' '\n'
          }

          # Phase 1: Detach capacity providers from ECS cluster.
          # This MUST happen first to break managed termination protection.
          echo "=== Phase 1: Detaching capacity providers ==="
          CLUSTER=""
          if stack_exists "$INFRA_STACK"; then
            CLUSTER=$(list_resources "$INFRA_STACK" "AWS::ECS::Cluster" | grep -v '^None$' | grep -v '^$' | head -n 1 || true)
          fi
          if [ -n "$CLUSTER" ]; then
            echo "Found ECS cluster $CLUSTER."
            aws ecs put-cluster-capacity-providers \
              --cli-input-json "{\"cluster\":\"$CLUSTER\",\"capacityProviders\":[],\"defaultCapacityProviderStrategy\":[]}" \
              >/dev/null 2>&1 || echo "Could not detach capacity providers; they may already be detached."
          else
            echo "No ECS cluster found; skipping."
          fi

          # Phase 2: Force-delete all ECS services (bypasses scale-to-0 deadlock).
          echo "=== Phase 2: Force-deleting ECS services ==="
          DELETED_SERVICES=()
          if [ -n "$CLUSTER" ]; then
            mapfile -t SERVICES < <(
              {
                if stack_exists "$APP_STACK"; then list_resources "$APP_STACK" "AWS::ECS::Service"; fi
                if stack_exists "$INFRA_STACK"; then list_resources "$INFRA_STACK" "AWS::ECS::Service"; fi
              } | grep -v '^None$' | grep -v '^$'
            )
            for SERVICE in "${SERVICES[@]}"; do
              echo "Force-deleting service $SERVICE."
              if aws ecs delete-service --cluster "$CLUSTER" --service "$SERVICE" --force >/dev/null 2>&1; then
                DELETED_SERVICES+=("$SERVICE")
              else
                echo "Could not delete $SERVICE; it may already be deleting."
              fi
            done
          fi

          # Phase 3: Stop remaining ECS tasks with a timeout.
          echo "=== Phase 3: Stopping ECS tasks ==="
          if [ -n "$CLUSTER" ]; then
            mapfile -t TASKS < <(
              {
                aws ecs list-tasks --cluster "$CLUSTER" --desired-status RUNNING --query "taskArns" --output text 2>/dev/null
                aws ecs list-tasks --cluster "$CLUSTER" --desired-status PENDING --query "taskArns" --output text 2>/dev/null
              } | tr '\t' '\n'
            )
            ACTIVE_TASKS=()
            for TASK in "${TASKS[@]}"; do
              if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then continue; fi
              echo "Stopping task $TASK."
              if aws ecs stop-task --cluster "$CLUSTER" --task "$TASK" --reason "Force cleanup" >/dev/null 2>&1; then
                ACTIVE_TASKS+=("$TASK")
              fi
            done
            if [ ${#ACTIVE_TASKS[@]} -gt 0 ]; then
              echo "Waiting up to 120s for ${#ACTIVE_TASKS[@]} task(s) to stop..."
              SECONDS=0
              while (( SECONDS < 120 )); do
                REMAINING=$(aws ecs list-tasks --cluster "$CLUSTER" --desired-status RUNNING --query "taskArns" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' | grep -v '^$' | wc -l)
                if [ "$REMAINING" -eq 0 ]; then echo "All tasks stopped."; break; fi
                sleep 5
              done
              if (( SECONDS >= 120 )); then echo "WARNING: Timed out waiting for tasks to stop."; fi
            fi
          fi

          # Phase 4: Terminate ALL instances in the VPC (ASG + proxy + any others).
          # Direct EC2 terminate-instances bypasses ASG managed termination protection.
          echo "=== Phase 4: Terminating all instances ==="
          VPC_ID=""
          if stack_exists "$INFRA_STACK"; then
            VPC_ID=$(list_resources "$INFRA_STACK" "AWS::EC2::VPC" | grep -v '^None$' | grep -v '^$' | head -n 1 || true)
          fi
          if [ -n "$VPC_ID" ]; then
            echo "Found VPC $VPC_ID."
            mapfile -t INSTANCE_IDS < <(
              aws ec2 describe-instances \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
                --query 'Reservations[].Instances[].InstanceId' \
                --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' | grep -v '^$'
            )
            if [ ${#INSTANCE_IDS[@]} -gt 0 ]; then
              echo "Terminating ${#INSTANCE_IDS[@]} instance(s): ${INSTANCE_IDS[*]}"
              aws ec2 terminate-instances --instance-ids "${INSTANCE_IDS[@]}" >/dev/null 2>&1 || true
              echo "Waiting up to 300s for instances to terminate..."
              SECONDS=0
              while (( SECONDS < 300 )); do
                REMAINING=$(aws ec2 describe-instances \
                  --instance-ids "${INSTANCE_IDS[@]}" \
                  --query 'Reservations[].Instances[].State.Name' \
                  --output text 2>/dev/null | tr '\t' '\n' | grep -c -v 'terminated' || echo "0")
                if [ "$REMAINING" -eq 0 ]; then echo "All instances terminated."; break; fi
                sleep 10
              done
              if (( SECONDS >= 300 )); then echo "WARNING: Timed out waiting for instance termination."; fi
            else
              echo "No instances found in VPC."
            fi
          else
            echo "Could not resolve VPC ID; skipping instance termination."
          fi

          # Phase 5: Force-detach and delete all ENIs in the VPC.
          # ECS HOST-mode tasks and lingering ENIs block VPC deletion.
          echo "=== Phase 5: Cleaning up ENIs ==="
          if [ -n "$VPC_ID" ]; then
            mapfile -t ENI_IDS < <(
              aws ec2 describe-network-interfaces \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' \
                --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' | grep -v '^$'
            )
            for ENI in "${ENI_IDS[@]}"; do
              echo "Processing ENI $ENI."
              ATTACHMENT_ID=$(aws ec2 describe-network-interfaces \
                --network-interface-ids "$ENI" \
                --query 'NetworkInterfaces[0].Attachment.AttachmentId' \
                --output text 2>/dev/null || true)
              if [ -n "$ATTACHMENT_ID" ] && [ "$ATTACHMENT_ID" != "None" ]; then
                echo "  Force-detaching $ATTACHMENT_ID."
                aws ec2 detach-network-interface --attachment-id "$ATTACHMENT_ID" --force >/dev/null 2>&1 || true
                sleep 3
              fi
              aws ec2 delete-network-interface --network-interface-id "$ENI" >/dev/null 2>&1 || echo "  Could not delete $ENI yet."
            done
            # Retry once for ENIs that needed time to detach
            sleep 5
            mapfile -t ENI_IDS < <(
              aws ec2 describe-network-interfaces \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' \
                --output text 2>/dev/null | tr '\t' '\n' | grep -v '^None$' | grep -v '^$'
            )
            for ENI in "${ENI_IDS[@]}"; do
              echo "Retrying delete for ENI $ENI."
              aws ec2 delete-network-interface --network-interface-id "$ENI" >/dev/null 2>&1 || echo "  Could not delete $ENI (may need manual cleanup)."
            done
          fi

          # Phase 6: Detach Internet Gateway so VPCGatewayAttachment can be deleted.
          echo "=== Phase 6: Detaching Internet Gateway ==="
          if [ -n "$VPC_ID" ]; then
            IGW_ID=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' \
              --output text 2>/dev/null || true)
            if [ -n "$IGW_ID" ] && [ "$IGW_ID" != "None" ]; then
              echo "Detaching IGW $IGW_ID from VPC $VPC_ID."
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW_ID" --vpc-id "$VPC_ID" >/dev/null 2>&1 || echo "Could not detach IGW."
            else
              echo "No IGW attached to VPC."
            fi
          fi

          echo "=== Force cleanup complete ==="

      - name: CDK destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk destroy --force \
            "${{ steps.stacks.outputs.app }}" \
            "${{ steps.stacks.outputs.infra }}" \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

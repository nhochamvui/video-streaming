name: RTMP AWS Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "CDK action to run"
        required: true
        type: choice
        default: "deploy"
        options:
          - synth
          - deploy
          - destroy
      deploy_mode:
        description: "Infra mode"
        required: true
        type: choice
        default: "cheap"
        options:
          - cheap
          - managed
      build_type:
        description: "App image build type: native (Dockerfile.native) or jvm (Dockerfile)"
        required: false
        type: choice
        default: "jvm"
        options:
          - jvm
          - native
      aws_region:
        description: "AWS region"
        required: true
        type: string
        default: "ap-southeast-1"
      desired_app_count:
        description: "Number of app nodes/tasks"
        required: true
        type: number
        default: 1
      max_app_count:
        description: "Maximum cheap-mode demo app ports to expose"
        required: true
        type: number
        default: 3
      frontend_tag:
        description: "Frontend image tag to pull from ECR during app image build"
        required: false
        type: string
        default: "latest"
      instance_type:
        description: "Cheap-mode ECS EC2 instance type"
        required: true
        type: string
        default: "t4g.micro"
      rtmp_host:
        description: "RTMP host advertised to streamers. For cheap mode, point a domain to the proxy Elastic IP output."
        required: false
        type: string
        default: "replace-after-deploy.example.com"
      admin_cidr:
        description: "CIDR allowed to SSH to cheap-mode EC2"
        required: false
        type: string
        default: "0.0.0.0/0"
      enable_alb:
        description: "Managed mode: create ALB for HTTP/UI/API"
        required: false
        type: boolean
        default: false
      enable_nlb:
        description: "Managed mode: create NLB for RTMP"
        required: false
        type: boolean
        default: false
      enable_elasticache:
        description: "Managed mode: create shared ElastiCache Redis"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rtmp-aws-${{ inputs.deploy_mode }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  ECR_REPOSITORY: rtmp-demo
  ECR_FRONTEND_REPOSITORY: rtmp-frontend
  INFRA_DIR: java/rtmp/infra/aws

jobs:
  cdk:
    name: ${{ inputs.action }} ${{ inputs.deploy_mode }} stack
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          JWT=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "Raw token: $JWT"
          echo "$JWT" | cut -d. -f2 | base64 -d | jq . || echo "Could not decode claims"

      - name: Debug manual assume-role-with-web-identity
        run: |
          JWT=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          aws sts assume-role-with-web-identity \
            --role-arn "${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}" \
            --role-session-name debug \
            --web-identity-token "$JWT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache CDK dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.INFRA_DIR }}/node_modules
          key: cdk-${{ runner.os }}-${{ hashFiles(format('{0}/package.json', env.INFRA_DIR)) }}
          restore-keys: |
            cdk-${{ runner.os }}-

      - name: Install CDK dependencies
        working-directory: ${{ env.INFRA_DIR }}
        run: npm install

      - name: Build CDK app
        working-directory: ${{ env.INFRA_DIR }}
        run: npm run build

      - name: Ensure ECR repository exists
        if: ${{ inputs.action == 'deploy' }}
        run: |
          for REPO in "${ECR_REPOSITORY}" "${ECR_FRONTEND_REPOSITORY}"; do
            aws ecr describe-repositories --repository-names "${REPO}" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "${REPO}" >/dev/null
          done

      - name: Log in to Amazon ECR
        if: ${{ inputs.action == 'deploy' }}
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ inputs.action == 'deploy' }}
        uses: docker/setup-buildx-action@v3

      - name: Check if app image already exists
        if: ${{ inputs.action == 'deploy' }}
        id: image-exists
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          if docker manifest inspect "$REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push app image
        if: ${{ inputs.action == 'deploy' && steps.image-exists.outputs.exists == 'false' }}
        id: image
        uses: docker/build-push-action@v6
        with:
          context: java/rtmp
          file: ${{ inputs.build_type == 'native' && 'java/rtmp/Dockerfile.native' || 'java/rtmp/Dockerfile' }}
          platforms: linux/arm64
          push: true
          build-contexts: |
            frontend=docker-image://${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ inputs.frontend_tag || 'latest' }}
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve app image
        id: app-image
        run: |
          if [ "${{ inputs.action }}" = "deploy" ]; then
            echo "uri=${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "uri=public.ecr.aws/docker/library/eclipse-temurin:21-jre" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve stack names
        id: stacks
        run: |
          if [ "${{ inputs.deploy_mode }}" = "managed" ]; then
            echo "infra=RtmpManagedDemoInfraStack" >> "$GITHUB_OUTPUT"
            echo "app=RtmpManagedDemoAppStack" >> "$GITHUB_OUTPUT"
          else
            echo "infra=RtmpCheapDemoInfraStack" >> "$GITHUB_OUTPUT"
            echo "app=RtmpCheapDemoAppStack" >> "$GITHUB_OUTPUT"
          fi

      - name: CDK synth
        if: ${{ inputs.action == 'synth' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk synth \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: CDK deploy
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk deploy --require-approval never \
            "${{ steps.stacks.outputs.infra }}" \
            "${{ steps.stacks.outputs.app }}" \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"

      - name: Stop ECS services before destroy
        if: ${{ inputs.action == 'destroy' }}
        run: |
          if [ "${{ inputs.deploy_mode }}" = "managed" ]; then
            APP_STACK="RtmpManagedDemoAppStack"
            INFRA_STACK="RtmpManagedDemoInfraStack"
          else
            APP_STACK="RtmpCheapDemoAppStack"
            INFRA_STACK="RtmpCheapDemoInfraStack"
          fi

          for STACK_NAME in "$APP_STACK" "$INFRA_STACK"; do
            if ! aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
              echo "Stack $STACK_NAME does not exist; skipping ECS service drain."
              continue
            fi

            CLUSTER=$(
              aws cloudformation describe-stack-resources \
                --stack-name "$STACK_NAME" \
                --query "StackResources[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId | [0]" \
                --output text
            )
            if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
              echo "No ECS cluster found in $STACK_NAME; skipping ECS service drain."
              continue
            fi

            mapfile -t SERVICES < <(
              aws cloudformation describe-stack-resources \
                --stack-name "$STACK_NAME" \
                --query "StackResources[?ResourceType=='AWS::ECS::Service'].PhysicalResourceId" \
                --output text | tr '\t' '\n'
            )

            ACTIVE_SERVICES=()
            for SERVICE in "${SERVICES[@]}"; do
              if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
                continue
              fi
              echo "Scaling ECS service $SERVICE to 0."
              if aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --desired-count 0 >/dev/null; then
                ACTIVE_SERVICES+=("$SERVICE")
              else
                echo "Could not scale $SERVICE; it may already be deleting."
              fi
            done

            if [ "${#ACTIVE_SERVICES[@]}" -gt 0 ]; then
              aws ecs wait services-stable --cluster "$CLUSTER" --services "${ACTIVE_SERVICES[@]}"
            fi

            mapfile -t TASKS < <(
              {
                aws ecs list-tasks --cluster "$CLUSTER" --desired-status RUNNING --query "taskArns" --output text
                aws ecs list-tasks --cluster "$CLUSTER" --desired-status PENDING --query "taskArns" --output text
              } | tr '\t' '\n'
            )

            ACTIVE_TASKS=()
            for TASK in "${TASKS[@]}"; do
              if [ -z "$TASK" ] || [ "$TASK" = "None" ]; then
                continue
              fi
              echo "Stopping ECS task $TASK."
              if aws ecs stop-task --cluster "$CLUSTER" --task "$TASK" --reason "GitHub Actions destroy cleanup" >/dev/null; then
                ACTIVE_TASKS+=("$TASK")
              else
                echo "Could not stop $TASK; it may already be stopping."
              fi
            done

            if [ "${#ACTIVE_TASKS[@]}" -gt 0 ]; then
              aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "${ACTIVE_TASKS[@]}"
            fi

            DELETED_SERVICES=()
            for SERVICE in "${ACTIVE_SERVICES[@]}"; do
              echo "Deleting ECS service $SERVICE before stack destroy."
              if aws ecs delete-service --cluster "$CLUSTER" --service "$SERVICE" --force >/dev/null; then
                DELETED_SERVICES+=("$SERVICE")
              else
                echo "Could not delete $SERVICE; it may already be deleting."
              fi
            done

            if [ "${#DELETED_SERVICES[@]}" -gt 0 ]; then
              aws ecs wait services-inactive --cluster "$CLUSTER" --services "${DELETED_SERVICES[@]}"
            fi

            echo "Detaching ECS cluster capacity providers before stack destroy."
            aws ecs put-cluster-capacity-providers \
              --cli-input-json "{\"cluster\":\"$CLUSTER\",\"capacityProviders\":[],\"defaultCapacityProviderStrategy\":[]}" \
              >/dev/null || echo "Could not detach capacity providers; they may already be detached or the cluster may be deleting."

            mapfile -t AUTO_SCALING_GROUPS < <(
              aws cloudformation describe-stack-resources \
                --stack-name "$STACK_NAME" \
                --query "StackResources[?ResourceType=='AWS::AutoScaling::AutoScalingGroup'].PhysicalResourceId" \
                --output text | tr '\t' '\n'
            )

            for AUTO_SCALING_GROUP in "${AUTO_SCALING_GROUPS[@]}"; do
              if [ -z "$AUTO_SCALING_GROUP" ] || [ "$AUTO_SCALING_GROUP" = "None" ]; then
                continue
              fi
              echo "Scaling Auto Scaling group $AUTO_SCALING_GROUP to 0."
              aws autoscaling update-auto-scaling-group \
                --auto-scaling-group-name "$AUTO_SCALING_GROUP" \
                --min-size 0 \
                --desired-capacity 0

              mapfile -t INSTANCE_IDS < <(
                aws autoscaling describe-auto-scaling-groups \
                  --auto-scaling-group-names "$AUTO_SCALING_GROUP" \
                  --query "AutoScalingGroups[0].Instances[].InstanceId" \
                  --output text | tr '\t' '\n'
              )

              ACTIVE_INSTANCE_IDS=()
              for INSTANCE_ID in "${INSTANCE_IDS[@]}"; do
                if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
                  ACTIVE_INSTANCE_IDS+=("$INSTANCE_ID")
                fi
              done

              if [ "${#ACTIVE_INSTANCE_IDS[@]}" -gt 0 ]; then
                aws ec2 wait instance-terminated --instance-ids "${ACTIVE_INSTANCE_IDS[@]}"
              fi
            done
          done

      - name: CDK destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.INFRA_DIR }}
        run: |
          npx cdk destroy --force \
            "${{ steps.stacks.outputs.app }}" \
            "${{ steps.stacks.outputs.infra }}" \
            -c deployMode="${{ inputs.deploy_mode }}" \
            -c appImage="${{ steps.app-image.outputs.uri }}" \
            -c desiredAppCount="${{ inputs.desired_app_count }}" \
            -c maxAppCount="${{ inputs.max_app_count }}" \
            -c instanceType="${{ inputs.instance_type }}" \
            -c rtmpHost="${{ inputs.rtmp_host }}" \
            -c adminCidr="${{ inputs.admin_cidr }}" \
            -c enableAlb="${{ inputs.enable_alb }}" \
            -c enableNlb="${{ inputs.enable_nlb }}" \
            -c enableElastiCache="${{ inputs.enable_elasticache }}"
